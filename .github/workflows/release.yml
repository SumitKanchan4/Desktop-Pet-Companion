# ─────────────────────────────────────────────────────────────────────────────
#  release.yml — Build BuddySetup.exe and attach it to a GitHub Release
#
#  Trigger:  push a tag matching v*  (e.g.  git tag v0.1.0 && git push origin v0.1.0)
#  Output:   GitHub Release containing BuddySetup-<version>.exe
# ─────────────────────────────────────────────────────────────────────────────
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 0.1.0) — used only for manual runs"
        required: true
        default: "0.0.0-dev"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # needed to create the Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Generate sprites
        run: python sprite_gen.py

      - name: Build executable
        run: pyinstaller build\Buddy.spec --noconfirm --clean

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Determine version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF -replace 'refs/tags/v', ''
          } else {
            $v = '${{ github.event.inputs.version }}'
          }
          echo "version=$v" >> $env:GITHUB_OUTPUT
          echo "Building version $v"

      - name: Compile installer
        env:
          BUDDY_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" build\installer.iss

      - name: Upload installer artefact
        uses: actions/upload-artifact@v4
        with:
          name: BuddySetup-${{ steps.ver.outputs.version }}
          path: build\Output\BuddySetup-*.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build\Output\BuddySetup-*.exe
          generate_release_notes: true
          draft: false
          prerelease: false
