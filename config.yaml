    - mpc
    - netflix
    - youtube
    - prime
    - hotstar
    - disney
pet:
  fps_full: 10
  fps_reduced: 5
  interaction_radius: 60
  name: Buddy
  scale: 2
  species: dog
  speed: 1.0
  wander_interval_s: 5
slm:
  backend: ollama
  behavior_update_interval_s: 120
  gemini_api_key: ''
  response_timeout_s: 15
  screen_read_interval_s: 60
  text_model: gemma3:1b
  vision_enabled: false
  vision_model: moondream
throttle:
  check_interval_s: 10
  full:
    cpu_max: 40
    ram_free_min_gb: 2.0
  minimal:
    cpu_max: 90
    ram_free_min_gb: 0.5
  reduced:
    cpu_max: 70
    ram_free_min_gb: 1.0
user:
  name: Sumit
